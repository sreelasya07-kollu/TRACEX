name: TRACEX Functional CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-recon:
    name: 3D Reconstruction Pipeline Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recon
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --extra cpu
      - name: Run fast unit tests
        run: uv run pytest -m light

  validate-ckit-tools:
    name: Client Tools (ckit) Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/ckit
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync
      - name: Run linter
        run: uv run ruff check .
