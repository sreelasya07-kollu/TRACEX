[versions]
agp = "9.5.1"
kotlin = "2.4.21"
ksp = "2.3.13"
arcore = "1.57.0"
tusAndroid = "0.1.12"
tusJava = "0.5.1"
room = "2.8.5"
work = "2.12.0"
sentry = "8.64.0"
litert = "2.3.2"
junit = "4.13.2"

[libraries]
arcore = { module = "com.google.ar:core", version.ref = "arcore" }
tus-android-client = { module = "io.tus.android.client:tus-android-client", version.ref = "tusAndroid" }
# tus-android-client's POM omits its parent class library, so it is declared explicitly.
tus-java-client = { module = "io.tus.java.client:tus-java-client", version.ref = "tusJava" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
sentry-android = { module = "io.sentry:sentry-android", version.ref = "sentry" }
litert = { module = "com.google.ai.edge.litert:litert", version.ref = "litert" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
